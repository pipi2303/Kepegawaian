services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    volumes:
      - ./laravel:/var/www/html
      - app_storage:/var/www/html/storage
    environment:
      - APP_ENV=${APP_ENV:-production}
    networks:
      - hcms_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./laravel:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - app_storage:/var/www/html/storage
    networks:
      - hcms_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-hcms_db}
      MYSQL_USER: ${DB_USERNAME:-hcms_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hcms_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  redis:
    image: redis:alpine
    restart: unless-stopped
    networks:
      - hcms_network

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./laravel:/var/www/html
      - app_storage:/var/www/html/storage
    networks:
      - hcms_network
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

networks:
  hcms_network:
    driver: bridge

volumes:
  db_data:
  app_storage:
