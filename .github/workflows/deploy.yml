  # To enable: add SSH_HOST, SSH_USER, SSH_KEY, SSH_PORT to GitHub Secrets

  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy triggered
        run: echo "Push to main detected. Vercel will auto-deploy the frontend."
