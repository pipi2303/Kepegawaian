name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

  test-backend:
    runs-on: ubuntu-latest
    # Non-blocking — backend CI runs but failure won't block Vercel deploy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, mbstring, xml, zip, bcmath

      - name: Install dependencies
        run: composer install --no-dev --optimize-autoloader --no-audit
        working-directory: laravel

      - name: Configure environment
        run: |
          cp .env.example .env
          php artisan key:generate
        working-directory: laravel

      - name: Run tests
        run: php artisan test
        working-directory: laravel
